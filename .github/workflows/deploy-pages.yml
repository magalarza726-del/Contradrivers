name: Deploy ContraDrivers to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Audit production before deployment
        run: |
          node --check game.js
          node --check game-data.js
          node --check src/core.js
          node --check src/vehicle.js
          node --check src/directors.js
          node --check src/openworld.js
          node --check src/settings.js
          node --check src/vehicle-factory.js
          node --check src/openworld-ui.js
          node --check src/openworld-runtime.js
          node tools/static-check.mjs
      - name: Build audited static artifact
        run: |
          mkdir -p dist/src
          cp index.html styles.css styles-v082.css game-data.js game.js .nojekyll dist/
          cp src/core.js src/vehicle.js src/directors.js src/openworld.js src/settings.js src/vehicle-factory.js src/openworld-ui.js src/openworld-runtime.js dist/src/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload production site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
