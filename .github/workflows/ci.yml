name: ContraDrivers Web QA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Syntax check app
        run: node --check app.js
      - name: Syntax check runtime modules
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Static contracts
        run: node tools/static-check.mjs
