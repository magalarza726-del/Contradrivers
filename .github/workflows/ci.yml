name: ContraDrivers Web QA

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  production-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Syntax check production entrypoint
        run: node --check game.js
      - name: Syntax check production modules
        run: |
          node --check game-data.js
          node --check src/core.js
          node --check src/vehicle.js
          node --check src/directors.js
          node --check src/openworld.js
          node --check src/settings.js
          node --check src/vehicle-factory.js
          node --check src/openworld-ui.js
          node --check src/openworld-runtime.js
      - name: Production contracts and regression audit
        run: node tools/static-check.mjs
